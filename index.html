<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧文件搜尋</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --surface:   #1a1d27;
    --surface2:  #22263a;
    --border:    #2e3250;
    --accent:    #4f8ef7;
    --accent2:   #7c5ef7;
    --text:      #e2e8f0;
    --muted:     #7a85a3;
    --success:   #34d399;
    --warn:      #fbbf24;
    --danger:    #f87171;
    --radius:    12px;
    --shadow:    0 4px 24px rgba(0,0,0,.4);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  .container { max-width: 800px; margin: 0 auto; }

  /* Header */
  .header { text-align: center; margin-bottom: 32px; }
  .header h1 {
    font-size: 1.8rem; font-weight: 700; letter-spacing: .02em;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .header p { color: var(--muted); font-size: .9rem; }

  /* Status bar */
  .status-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 16px;
    margin-bottom: 20px; font-size: .82rem; color: var(--muted);
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.ok      { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .status-dot.warn    { background: var(--warn);    box-shadow: 0 0 6px var(--warn); }
  .status-dot.loading { background: var(--muted); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .status-bar .spacer { flex: 1; }
  .btn-reindex {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: .78rem;
    transition: all .2s;
  }
  .btn-reindex:hover { border-color: var(--accent); color: var(--accent); }
  .btn-reindex:disabled { opacity: .4; cursor: not-allowed; }

  /* Search box */
  .search-wrap {
    position: relative; margin-bottom: 24px;
  }
  .search-wrap input {
    width: 100%; padding: 16px 56px 16px 20px;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-size: 1rem;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .search-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,142,247,.15);
  }
  .search-wrap input::placeholder { color: var(--muted); }
  .btn-search {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 8px; width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: opacity .2s;
  }
  .btn-search:hover { opacity: .85; }
  .btn-search:disabled { opacity: .4; cursor: not-allowed; }
  .btn-search svg { width: 18px; height: 18px; fill: #fff; }

  /* Loading spinner */
  .spinner {
    display: none; text-align: center; padding: 32px;
    color: var(--muted); font-size: .9rem;
  }
  .spinner.show { display: block; }
  .spin {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Result meta */
  .result-meta {
    font-size: .82rem; color: var(--muted); margin-bottom: 14px;
    display: none;
  }
  .result-meta.show { display: block; }
  .result-meta span { color: var(--accent); font-weight: 600; }

  /* Result cards */
  .results { display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px;
    transition: border-color .2s, box-shadow .2s;
    cursor: pointer; text-decoration: none; display: block; color: inherit;
  }
  .card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(79,142,247,.2), var(--shadow);
  }

  .card-top { display: flex; align-items: flex-start; gap: 12px; }
  .card-icon {
    width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; background: var(--surface2);
  }
  .card-title { font-size: .95rem; font-weight: 600; line-height: 1.4; flex: 1; }
  .score-badge {
    flex-shrink: 0; font-size: .72rem; font-weight: 700; padding: 2px 8px;
    border-radius: 20px; background: rgba(79,142,247,.15); color: var(--accent);
    border: 1px solid rgba(79,142,247,.3);
  }
  .score-badge.high  { background: rgba(52,211,153,.15); color: var(--success); border-color: rgba(52,211,153,.3); }
  .score-badge.med   { background: rgba(251,191,36,.12);  color: var(--warn);    border-color: rgba(251,191,36,.3); }

  .card-snippet {
    margin-top: 8px; font-size: .82rem; color: var(--muted); line-height: 1.6;
    padding-left: 48px;
  }
  .card-meta {
    margin-top: 8px; font-size: .76rem; color: var(--muted);
    padding-left: 48px; display: flex; gap: 16px; flex-wrap: wrap;
  }

  /* Empty / error state */
  .empty-state {
    text-align: center; padding: 48px 16px;
    color: var(--muted); display: none;
  }
  .empty-state.show { display: block; }
  .empty-state svg { width: 48px; height: 48px; opacity: .3; margin-bottom: 12px; }
  .empty-state p { font-size: .9rem; }

  .error-box {
    background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.3);
    border-radius: var(--radius); padding: 14px 16px;
    color: var(--danger); font-size: .85rem; display: none;
  }
  .error-box.show { display: block; }

  /* Reindex progress */
  .reindex-toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 18px;
    font-size: .84rem; color: var(--text); box-shadow: var(--shadow);
    display: none; max-width: 300px; z-index: 100;
  }
  .reindex-toast.show { display: block; }
  .reindex-toast .toast-title { font-weight: 600; margin-bottom: 4px; }
  .reindex-toast .toast-msg { color: var(--muted); font-size: .8rem; }

  /* Responsive */
  @media (max-width: 480px) {
    .header h1 { font-size: 1.4rem; }
    .card-snippet, .card-meta { padding-left: 0; margin-top: 8px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>🔍 智慧文件搜尋</h1>
    <p>大詠城機械 — 語意向量搜尋系統</p>
  </div>

  <!-- 索引狀態列 -->
  <div class="status-bar">
    <div class="status-dot loading" id="statusDot"></div>
    <span id="statusText">檢查索引狀態…</span>
    <div class="spacer"></div>
    <button class="btn-reindex" id="btnReindex" disabled onclick="reindex()">重建索引</button>
  </div>

  <!-- 搜尋框 -->
  <div class="search-wrap">
    <input type="text" id="query" placeholder="輸入關鍵字，例如：出差申請、品質報告、鑄件缺陷…"
           onkeydown="if(event.key==='Enter') search()" autocomplete="off" />
    <button class="btn-search" id="btnSearch" onclick="search()">
      <svg viewBox="0 0 24 24"><path d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- 錯誤訊息 -->
  <div class="error-box" id="errorBox"></div>

  <!-- 搜尋中 -->
  <div class="spinner" id="spinner">
    <div class="spin"></div>
    語意分析中，請稍候…
  </div>

  <!-- 結果數量 -->
  <div class="result-meta" id="resultMeta"></div>

  <!-- 結果列表 -->
  <div class="results" id="results"></div>

  <!-- 空結果 -->
  <div class="empty-state" id="emptyState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <p>找不到相關文件，請嘗試其他關鍵字</p>
  </div>

</div>

<!-- 重建索引提示 -->
<div class="reindex-toast" id="reindexToast">
  <div class="toast-title">⚙️ 重建索引中…</div>
  <div class="toast-msg" id="toastMsg">正在掃描資料夾，依文件數量需 1–5 分鐘</div>
</div>

<script>
// GAS Web App 自己就是後端，同源呼叫直接用 fetch
const GAS_URL = '<?= ScriptApp.getService().getUrl() ?>';

const MIME_ICON = {
  'application/pdf': '📄',
  'application/vnd.openxmlformats-officedocument.wordprocessingml.document': '📝',
  'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': '📊',
  'application/vnd.ms-excel': '📊',
  'application/vnd.google-apps.document': '📝',
  'application/vnd.google-apps.spreadsheet': '📊',
  'image/jpeg': '🖼️', 'image/png': '🖼️', 'image/gif': '🖼️',
  'text/plain': '📃',
};

function getIcon(mime) {
  return MIME_ICON[mime] || '📁';
}

function scoreClass(s) {
  if (s >= 0.7) return 'high';
  if (s >= 0.5) return 'med';
  return '';
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' +
         String(d.getDate()).padStart(2,'0');
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(0) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}

// ── 狀態檢查 ──────────────────────────────────────
async function checkStatus() {
  const dot  = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const btn  = document.getElementById('btnReindex');

  try {
    const resp = await fetch(GAS_URL + '?action=status');
    const data = await resp.json();

    if (data.ok && data.hasIndex) {
      dot.className  = 'status-dot ok';
      text.textContent = '索引正常 · ' + data.count + ' 份文件 · 建立於 ' + formatDate(data.indexedAt);
    } else {
      dot.className  = 'status-dot warn';
      text.textContent = '尚未建立索引，請點右側「重建索引」';
    }
  } catch (e) {
    dot.className  = 'status-dot warn';
    text.textContent = '無法取得索引狀態';
  }
  btn.disabled = false;
}

// ── 搜尋 ──────────────────────────────────────────
async function search() {
  const query    = document.getElementById('query').value.trim();
  const spinner  = document.getElementById('spinner');
  const results  = document.getElementById('results');
  const meta     = document.getElementById('resultMeta');
  const empty    = document.getElementById('emptyState');
  const errorBox = document.getElementById('errorBox');
  const btn      = document.getElementById('btnSearch');

  if (!query) return;

  // Reset
  results.innerHTML = '';
  meta.classList.remove('show');
  empty.classList.remove('show');
  errorBox.classList.remove('show');
  spinner.classList.add('show');
  btn.disabled = true;

  try {
    const resp = await fetch(GAS_URL + '?action=search&query=' + encodeURIComponent(query));
    const data = await resp.json();

    spinner.classList.remove('show');
    btn.disabled = false;

    if (!data.ok) {
      errorBox.textContent = data.error || '搜尋失敗';
      errorBox.classList.add('show');
      return;
    }

    if (!data.results || data.results.length === 0) {
      empty.classList.add('show');
      return;
    }

    meta.innerHTML = '找到 <span>' + data.results.length + '</span> 份相關文件（共索引 ' + (data.indexedCount||'?') + ' 份）';
    meta.classList.add('show');

    results.innerHTML = data.results.map(r => `
      <a class="card" href="${r.url}" target="_blank" rel="noopener">
        <div class="card-top">
          <div class="card-icon">${getIcon(r.mimeType)}</div>
          <div class="card-title">${escHtml(r.name)}</div>
          <div class="score-badge ${scoreClass(r.score)}">${(r.score*100).toFixed(0)}%</div>
        </div>
        ${r.snippet ? `<div class="card-snippet">${escHtml(r.snippet)}</div>` : ''}
        <div class="card-meta">
          ${r.modifiedDate ? '<span>📅 ' + formatDate(r.modifiedDate) + '</span>' : ''}
          ${r.size ? '<span>💾 ' + formatSize(r.size) + '</span>' : ''}
        </div>
      </a>
    `).join('');

  } catch (e) {
    spinner.classList.remove('show');
    btn.disabled = false;
    errorBox.textContent = '網路錯誤：' + e.message;
    errorBox.classList.add('show');
  }
}

// ── 重建索引 ──────────────────────────────────────
async function reindex() {
  const btn   = document.getElementById('btnReindex');
  const toast = document.getElementById('reindexToast');
  const msg   = document.getElementById('toastMsg');
  const dot   = document.getElementById('statusDot');
  const text  = document.getElementById('statusText');

  btn.disabled = true;
  toast.classList.add('show');
  dot.className = 'status-dot loading';
  text.textContent = '重建索引中…';

  try {
    const resp = await fetch(GAS_URL + '?action=reindex');
    const data = await resp.json();

    toast.classList.remove('show');

    if (data.ok) {
      msg.textContent = '完成';
      dot.className   = 'status-dot ok';
      text.textContent = '索引已更新 · ' + data.indexed + ' 份文件 · 剛才';
    } else {
      dot.className   = 'status-dot warn';
      text.textContent = '重建失敗：' + (data.error || '未知錯誤');
    }
  } catch (e) {
    toast.classList.remove('show');
    dot.className   = 'status-dot warn';
    text.textContent = '重建失敗：' + e.message;
  }

  btn.disabled = false;
}

function escHtml(str) {
  return String(str||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 啟動
checkStatus();
</script>
</body>
</html>
